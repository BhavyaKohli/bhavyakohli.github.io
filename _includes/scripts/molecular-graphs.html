{%- if page.molecular_graphs or page.molecular_graphs_background -%}
  <!-- Molecular Graphs -->
  <script src="{{ '/assets/js/molecular-graphs.js' | relative_url }}"></script>
  {%- if page.molecular_graphs -%}
  <script>
    MolecularGraphs.background(
      "{{ page.molecular_graphs_target | default: "#graphs-hero" }}",
      { opacity: {{ page.molecular_graphs_opacity | default: 0.9 }}, interactive: true }
    );
  </script>
  {%- elsif page.molecular_graphs_background -%}
  <script>
    (function () {
      var raw = {{ page.molecular_graphs_background | default: 0.5 }};
      var opacity = typeof raw === "number" ? raw : 0.5;
      MolecularGraphs.background(null, { opacity: opacity });
    })();
  </script>
  {%- endif -%}
{%- endif -%}
